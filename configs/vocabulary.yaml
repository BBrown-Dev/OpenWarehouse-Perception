# Open vocabulary: add a class here without retraining the detector.
# `critical` classes are the ones whose misses the safety metrics weigh most heavily.
prompt_templates:
  - "a photo of {} in a warehouse"
  - "a security camera image of {}"
  - "a forklift camera view of {}"

classes:
  person: {synonyms: ["a person", "a warehouse worker"], critical: true}
  forklift: {synonyms: ["a forklift", "a pallet truck"], critical: true}
  pallet: {synonyms: ["a pallet", "a wooden pallet"], critical: false}
  rack: {synonyms: ["a storage rack", "warehouse shelving"], critical: false}
  fallen_load: {synonyms: ["a fallen box", "spilled cargo on the floor"], critical: true}
  spill: {synonyms: ["a liquid spill on the floor"], critical: true}
